<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICE HOCKEY — Main Menu</title>
<!-- Fonts are SELF-HOSTED (fonts/, regenerate with tools/vendor_fonts.py).
     They used to come from fonts.googleapis.com, which is a third-party
     request on the first paint of the page and is simply unreachable in the
     packaged desktop build, where the same files are loaded from disk with no
     network at all. -->
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- The room you stand in before a game. The photograph IS the room now: the
     CSS-drawn lockers and light shafts that used to be here are gone, because
     drawn seams over a real photograph of lockers read as a rendering bug
     rather than as detail. #bgProps is deliberately EMPTY — it is the mount
     point for team and player specific set dressing (a jersey on a hook, a
     crest on the far wall, a stick against the bench). See
     reference/LOCKER_ROOM_IMAGE.md for the contract props follow. -->
<div class="bg-locker" aria-hidden="true">
  <div class="base"></div>
  <div class="grade"></div>
  <div class="bg-props" id="bgProps"></div>
  <div class="floor"></div>
  <div class="vignette"></div>
</div>

<div class="app">

  <header class="topnav">
    <div class="brand"><span class="brand-mark">IH</span><span class="brand-text">ICE HOCKEY</span></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Main sections">
      <span class="tab-indicator" id="tabIndicator" aria-hidden="true"></span>
    </nav>
    <button class="fs-chip" id="fsChip" type="button" data-fullscreen-toggle aria-pressed="false" title="Enter fullscreen (F11)">
      <span class="fs-icon" data-fs-icon aria-hidden="true">⛶</span>
      <span class="fs-label" data-fs-label>FULLSCREEN</span>
    </button>

    <button class="party-chip" id="partyChip" type="button" aria-haspopup="true" aria-expanded="false">
      <span class="party-dots" id="partyDots"></span>
      <span class="party-label" id="partyLabel">PARTY</span>
      <span class="party-caret" aria-hidden="true"></span>
    </button>

    <div class="profile-chip">
      <div class="ovr-badge">72<span>OVR</span></div>
      <div class="profile-id">
        <span class="name">SNIPER92</span>
        <span class="role">Right Wing · Helsinki Wolves</span>
      </div>
    </div>
  </header>

  <!-- Party roster popover — assemble local players here, before picking a
       mode. Built/positioned by script.js relative to #partyChip. -->
  <div class="party-popover glass" id="partyPopover" aria-hidden="true"></div>

  <div class="layout">

    <aside class="panel-left glass" aria-label="Section menu">
      <h1 class="section-title" id="sectionTitle">PLAY</h1>
      <div class="menu-list" id="menuList" role="listbox" aria-labelledby="sectionTitle">
        <span class="menu-rail" id="menuRail" aria-hidden="true"></span>
      </div>
    </aside>

    <section class="stage" aria-label="Player preview">
      <div class="stage-spot" aria-hidden="true"></div>
      <div class="stage-floor-glow" aria-hidden="true"></div>
      <!-- Intentionally empty. A future WebGL renderer mounts its canvas here. -->
      <div id="player-placeholder"></div>
      <div class="stage-caption" id="stageCaption">
        <div class="cap-title" id="capTitle">Quick Match</div>
        <div class="cap-sub" id="capSub">Jump into a game</div>
      </div>
    </section>

    <aside class="panel-right" id="widgetRail" aria-label="Info"></aside>

  </div>

  <footer class="hintbar">
    <div class="kb-hints">
      <span class="hint"><i class="key">↑↓</i>Navigate</span>
      <span class="hint"><i class="key">←→</i>Section</span>
      <span class="hint"><i class="key">Enter</i>Select</span>
    </div>
    <div class="pad-hints">
      <span class="hint"><i class="key round">A</i>Select</span>
      <span class="hint"><i class="key round">B</i>Back</span>
      <span class="hint"><i class="key round">LB</i><i class="key round">RB</i>Section</span>
    </div>
  </footer>

</div>

<div class="toast glass" id="toast" role="status" aria-live="polite"></div>

<!-- Built by script.js when a real mode (Practice/Match Mode) is picked —
     settings are chosen and confirmed HERE, not on a second screen in-game. -->
<div class="confirm-overlay" id="confirmOverlay" aria-hidden="true"></div>

<!-- Loaded FIRST and everywhere, ahead of the game itself: the Xbox
     Developer Mode host (xbox/) runs this same page in an EdgeHTML
     WebView, which has no Array.prototype.flatMap. Without it the game
     still boots and then silently forgets every saved setting — see
     compat/es2019.js, and xbox/tools/edgehtml_sim.sh, which measures it
     both ways. A no-op in every Chromium/Firefox/Safari build. -->
<script src="compat/es2019.js"></script>
<script src="fullscreen.js"></script>
<script src="script.js"></script>
<!-- 3D player preview: your ★ favourite team+jersey look from the Locker
     Room, rendered into #player-placeholder. Deferred so the menu itself
     paints first; if WebGL/assets fail the stage just stays empty. -->
<script defer src="vendor/three.min.js"></script>
<script defer src="vendor/GLTFLoader.js"></script>
<script defer src="ice-hockey-customize-data.js"></script>
<script defer src="ice-hockey-customize-core.js"></script>
<script defer src="menu-player.js"></script>
</body>
</html>
