<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICE HOCKEY — Main Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   STYLE.CSS
   Ice Hockey — front-end menu shell
   Sections: variables / reset / background / app grid /
             top nav / left panel / center stage / right panel /
             hint bar / toast / focus & motion / responsive
   ============================================================ */

/* ---------- variables ---------- */
:root{
  --bg-0:#05070b;
  --bg-1:#0a0d15;
  --panel:rgba(15,19,29,.60);
  --panel-strong:rgba(11,14,22,.82);
  --line:rgba(255,255,255,.08);
  --line-strong:rgba(255,255,255,.16);

  --accent:#4f8dfd;
  --accent-dim:#2f6fe0;
  --accent-soft:rgba(79,141,253,.14);
  --accent-glow:rgba(79,141,253,.5);

  --ink:#eaeef6;
  --ink-dim:#8a93a6;
  --ink-faint:#565e70;
  --ok:#38d987;

  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;

  --dur:130ms;
  --ease:cubic-bezier(.22,.7,.32,1);

  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;

  --nav-h:66px;
  --hint-h:34px;
}

/* ---------- reset ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg-0);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
h1,h2,p{margin:0}

/* ============================================================
   BACKGROUND — CSS-only locker room (no images, no canvas)
   ============================================================ */
.bg-locker{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg-0);pointer-events:none}

.bg-locker .base{
  position:absolute;inset:0;
  background:
    radial-gradient(130% 85% at 50% -8%, #172136 0%, #0d1220 40%, #05070b 76%);
}

/* locker-door seams along the back wall, faded top & bottom */
.bg-locker .lockers{
  position:absolute;inset:0;opacity:.55;
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 108px),
    repeating-linear-gradient(90deg, transparent 0 104px, rgba(79,141,253,.06) 104px 108px);
  -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 20%, #000 52%, transparent 74%);
          mask-image:linear-gradient(180deg, transparent 0%, #000 20%, #000 52%, transparent 74%);
}

/* soft ceiling light shafts */
.bg-locker .rays{
  position:absolute;top:-6%;left:50%;width:78vw;height:70vh;transform:translateX(-50%);
  background:
    linear-gradient(100deg, transparent 42%, rgba(190,215,255,.05) 46%, transparent 50%),
    linear-gradient(80deg, transparent 58%, rgba(190,215,255,.04) 62%, transparent 67%);
}

/* floor */
.bg-locker .floor{
  position:absolute;left:0;right:0;bottom:0;height:44%;
  background:linear-gradient(180deg, rgba(9,12,19,0) 0%, rgba(7,9,15,.92) 62%, #03040a 100%);
}
.bg-locker .floor::before{
  content:"";position:absolute;left:50%;bottom:0;width:60%;height:100%;transform:translateX(-50%);
  background:radial-gradient(closest-side, rgba(79,141,253,.10), transparent 72%);
}

/* vignette */
.bg-locker .vignette{
  position:absolute;inset:0;
  background:radial-gradient(120% 100% at 50% 38%, transparent 52%, rgba(0,0,0,.58) 100%);
}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{
  position:relative;z-index:1;
  height:100vh;height:100dvh;
  display:grid;
  grid-template-rows:var(--nav-h) 1fr var(--hint-h);
}

.glass{
  background:var(--panel);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);
  backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  box-shadow:0 10px 34px rgba(0,0,0,.35);
}

/* ============================================================
   1. TOP NAVIGATION
   ============================================================ */
.topnav{
  display:flex;align-items:center;gap:22px;
  padding:0 clamp(16px,2vw,28px);
  background:linear-gradient(180deg, rgba(6,8,12,.86), rgba(6,8,12,.4) 80%, transparent);
  border-bottom:1px solid rgba(255,255,255,.05);
}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-mark{
  width:30px;height:30px;border-radius:8px;background:var(--accent);
  display:grid;place-items:center;color:#04070d;
  font-family:var(--font-display);font-weight:700;font-size:15px;
  box-shadow:0 0 16px var(--accent-glow);
}
.brand-text{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.14em}

.tabs{position:relative;display:flex;align-items:center;gap:2px;margin:0 auto;height:100%}
.tab{
  position:relative;z-index:1;
  font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.1em;
  color:var(--ink-dim);padding:9px 16px;border-radius:9px;
  transition:color var(--dur) var(--ease);
  min-height:38px;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab-indicator{
  position:absolute;left:0;top:50%;height:38px;transform:translate(0,-50%);
  background:var(--accent-soft);border:1px solid var(--accent);border-radius:9px;
  box-shadow:inset 0 0 14px rgba(255,255,255,.03);
  transition:transform var(--dur) var(--ease), width var(--dur) var(--ease);
  pointer-events:none;
}

.profile-chip{display:flex;align-items:center;gap:10px;flex:none}
.ovr-badge{
  width:38px;height:38px;border-radius:10px;background:var(--accent);color:#04070d;
  display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:15px;
  line-height:1;box-shadow:0 0 14px var(--accent-glow);
}
.ovr-badge span{display:none}
.profile-id{display:flex;flex-direction:column;line-height:1.25}
.profile-id .name{font-family:var(--font-display);font-weight:600;font-size:14.5px;letter-spacing:.06em}
.profile-id .role{font-size:11px;color:var(--ink-dim)}

/* ============================================================
   LAYOUT — left panel / center stage / right panel
   ============================================================ */
.layout{
  position:relative;min-height:0;
  display:grid;
  grid-template-columns:clamp(232px,19vw,300px) 1fr clamp(220px,17vw,296px);
  gap:clamp(12px,1.4vw,20px);
  padding:clamp(12px,1.6vw,22px);
  max-width:2200px;margin-inline:auto;width:100%;
}

/* ---------- 2. LEFT PANEL ---------- */
.panel-left{
  min-height:0;display:flex;flex-direction:column;
  padding:clamp(16px,1.6vw,22px) 12px 14px;
}
.section-title{
  font-family:var(--font-display);font-weight:700;font-size:clamp(22px,2vw,28px);
  letter-spacing:.13em;padding:0 12px 10px;flex:none;
}
.section-title::after{
  content:"";display:block;width:42px;height:3px;margin-top:9px;
  background:var(--accent);border-radius:2px;box-shadow:0 0 10px var(--accent-glow);
}
.menu-list{
  position:relative;margin-top:6px;padding:2px;
  display:flex;flex-direction:column;gap:4px;
  overflow-y:auto;scrollbar-width:thin;
}
.menu-rail{
  position:absolute;left:2px;right:2px;top:0;height:0;
  background:var(--accent-soft);border:1px solid var(--accent);border-radius:11px;
  box-shadow:0 0 12px var(--accent-glow) inset;
  transition:transform var(--dur) var(--ease), height var(--dur) var(--ease), opacity var(--dur) var(--ease);
  pointer-events:none;z-index:0;
}
.menu-item{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:13px;width:100%;
  padding:11px 12px;border-radius:11px;text-align:left;
  min-height:52px;
  transition:background var(--dur) var(--ease);
}
.menu-item:hover{background:rgba(255,255,255,.045)}
.menu-item svg{width:21px;height:21px;flex:none;stroke:var(--ink-dim);transition:stroke var(--dur) var(--ease)}
.menu-item[aria-selected="true"] svg{stroke:var(--accent)}
.menu-item .t{font-family:var(--font-display);font-weight:600;font-size:16.5px;letter-spacing:.06em;line-height:1.15}
.menu-item .s{font-size:11.5px;color:var(--ink-dim);margin-top:2px}
.menu-item.is-pressed{transform:scale(.985)}

/* ---------- 3. CENTER STAGE ---------- */
.stage{
  position:relative;min-width:0;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:clamp(18px,3vh,40px);
}
.stage-spot{
  position:absolute;left:50%;top:0;width:min(48%,400px);height:66%;transform:translateX(-50%);
  background:linear-gradient(180deg, rgba(185,212,255,.11), rgba(185,212,255,0) 72%);
  clip-path:polygon(38% 0%, 62% 0%, 100% 100%, 0% 100%);
  animation:spotBreathe 7s ease-in-out infinite;
}
@keyframes spotBreathe{0%,100%{opacity:.75}50%{opacity:1}}
.stage-floor-glow{
  position:absolute;left:50%;bottom:7%;width:min(72%,540px);height:15%;transform:translateX(-50%);
  background:radial-gradient(closest-side, rgba(79,141,253,.30), rgba(79,141,253,0) 70%);
}

/* Intentionally empty mount point for a future WebGL player.
   Fill it later with a canvas/renderer sized to 100% x 100%. */
#player-placeholder{
  position:relative;z-index:2;
  width:min(30vw,420px);
  height:min(62vh,620px);
}

.stage-caption{
  position:absolute;left:clamp(16px,2vw,28px);bottom:clamp(14px,2vh,26px);z-index:2;
  transition:opacity 120ms ease;
}
.stage-caption .cap-title{
  font-family:var(--font-display);font-weight:700;text-transform:uppercase;
  font-size:clamp(20px,2.3vw,32px);letter-spacing:.1em;
  text-shadow:0 2px 18px rgba(0,0,0,.6);
}
.stage-caption .cap-sub{
  font-size:12.5px;color:var(--ink-dim);letter-spacing:.03em;margin-top:2px;
  text-shadow:0 2px 12px rgba(0,0,0,.6);
}

/* ---------- 4. RIGHT PANEL ---------- */
.panel-right{
  min-height:0;display:flex;flex-direction:column;gap:12px;
  overflow-y:auto;scrollbar-width:thin;padding-right:2px;
}
.widget{padding:14px 16px;flex:none}
.widget-title{
  font-family:var(--font-display);font-weight:600;font-size:12.5px;
  letter-spacing:.16em;color:var(--ink-dim);margin-bottom:10px;
}

.match-row{display:flex;align-items:center;justify-content:space-around;margin:2px 0 9px}
.crest{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--font-display);font-weight:700;font-size:15px;
  border:1.5px solid var(--line);background:rgba(255,255,255,.04);
}
.crest.home{border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px var(--accent-glow)}
.vs{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--ink-dim);letter-spacing:.1em}
.meta-line{text-align:center;font-size:11.5px;color:var(--ink-dim);letter-spacing:.05em;line-height:1.6}

.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 6px}
.bar > span{display:block;height:100%;border-radius:3px;background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.stat-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-dim)}
.stat-row b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.friend{display:flex;align-items:center;gap:9px;padding:5px 0}
.friend .av{
  width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.08);
  display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--ink-dim);flex:none;
}
.friend .n{font-size:12.5px;font-weight:500}
.friend .st{font-size:10.5px;color:var(--ink-dim)}
.friend .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);flex:none}
.more-line{font-size:11px;color:var(--ink-dim);padding-top:3px}

.activity-list li{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:var(--ink-dim);padding:4px 0}
.activity-list b{color:var(--ink);font-weight:500}
.activity-list .act-dot{width:6px;height:6px;margin-top:4px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 6px var(--accent-glow)}
.activity-list time{margin-left:auto;flex:none;font-size:10px;color:var(--ink-faint)}

.reward-line{font-size:11px;color:var(--ink-dim)}
.reward-line b{color:var(--accent);font-weight:600}

.news-line{font-family:var(--font-display);font-weight:600;font-size:14.5px;letter-spacing:.05em;line-height:1.3}
.news-sub{font-size:11px;color:var(--ink-dim);margin-top:5px}

/* ============================================================
   HINT BAR
   ============================================================ */
.hintbar{
  display:flex;align-items:center;gap:18px;
  padding:0 clamp(16px,2vw,28px);
  font-size:11.5px;color:var(--ink-dim);
  background:linear-gradient(0deg, rgba(5,7,11,.55), transparent);
}
.hintbar .hint{display:flex;align-items:center;gap:7px}
.hintbar .key{
  display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;
  border-radius:5px;border:1.5px solid var(--ink-faint);
  font-family:var(--font-display);font-weight:700;font-size:10px;color:var(--ink-dim);
}
.hintbar .key.round{border-radius:50%}
.pad-hints{display:none;align-items:center;gap:18px}
body.pad-active .pad-hints{display:flex}
body.pad-active .kb-hints{display:none}

/* ============================================================
   TOAST
   ============================================================ */
.toast{
  position:fixed;left:50%;bottom:calc(var(--hint-h) + 20px);z-index:5;
  transform:translate(-50%,8px);opacity:0;pointer-events:none;
  padding:9px 20px;font-family:var(--font-display);font-weight:600;font-size:14.5px;letter-spacing:.09em;
  transition:opacity 140ms ease, transform 140ms ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   FOCUS & MOTION
   ============================================================ */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ============================================================
   RESPONSIVE
   Desktop-first. Verified targets: 1440p, 1080p, Steam Deck
   (1280x800), ultrawide (>=2560, capped by .layout max-width).
   ============================================================ */
@media (max-width:1180px){
  .profile-id{display:none}
}
@media (max-width:1000px){
  .layout{grid-template-columns:clamp(220px,26vw,280px) 1fr}
  .panel-right{display:none}
}
@media (max-width:760px){
  .brand-text{display:none}
  .layout{grid-template-columns:1fr}
  .panel-left{display:none}
  .hintbar .hint:not(:first-child){display:none}
}
@media (max-height:640px){
  :root{--nav-h:56px;--hint-h:30px}
  #player-placeholder{height:min(52vh,520px)}
}
</style>
</head>
<body>

<div class="bg-locker" aria-hidden="true">
  <div class="base"></div>
  <div class="lockers"></div>
  <div class="rays"></div>
  <div class="floor"></div>
  <div class="vignette"></div>
</div>

<div class="app">

  <header class="topnav">
    <div class="brand"><span class="brand-mark">IH</span><span class="brand-text">ICE HOCKEY</span></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Main sections">
      <span class="tab-indicator" id="tabIndicator" aria-hidden="true"></span>
    </nav>
    <div class="profile-chip">
      <div class="ovr-badge">72<span>OVR</span></div>
      <div class="profile-id">
        <span class="name">SNIPER92</span>
        <span class="role">Right Wing · Helsinki Wolves</span>
      </div>
    </div>
  </header>

  <div class="layout">

    <aside class="panel-left glass" aria-label="Section menu">
      <h1 class="section-title" id="sectionTitle">PLAY</h1>
      <div class="menu-list" id="menuList" role="listbox" aria-labelledby="sectionTitle">
        <span class="menu-rail" id="menuRail" aria-hidden="true"></span>
      </div>
    </aside>

    <section class="stage" aria-label="Player preview">
      <div class="stage-spot" aria-hidden="true"></div>
      <div class="stage-floor-glow" aria-hidden="true"></div>
      <!-- Intentionally empty. A future WebGL renderer mounts its canvas here. -->
      <div id="player-placeholder"></div>
      <div class="stage-caption" id="stageCaption">
        <div class="cap-title" id="capTitle">Quick Match</div>
        <div class="cap-sub" id="capSub">Jump into a game</div>
      </div>
    </section>

    <aside class="panel-right" id="widgetRail" aria-label="Info"></aside>

  </div>

  <footer class="hintbar">
    <div class="kb-hints">
      <span class="hint"><i class="key">↑↓</i>Navigate</span>
      <span class="hint"><i class="key">←→</i>Section</span>
      <span class="hint"><i class="key">Enter</i>Select</span>
    </div>
    <div class="pad-hints">
      <span class="hint"><i class="key round">A</i>Select</span>
      <span class="hint"><i class="key round">B</i>Back</span>
      <span class="hint"><i class="key round">LB</i><i class="key round">RB</i>Section</span>
    </div>
  </footer>

</div>

<div class="toast glass" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================

   Sections: data / icons / dom refs / tabs / menu list /
             widgets / indicators / toast / keyboard / gamepad / init
   Wrapped in a single closure — nothing is attached to window.
   ============================================================ */

      { icon:'pad',    t:'Controls',      s:'Classic / Hybrid scheme, sensitivity' },
      { icon:'person', t:'Accessibility', s:'Assists, contrast, text size' },
      { icon:'gear',   t:'Online',        s:'Privacy and crossplay' }
    ]}
  ];

  /* ---------------- icons: small inline SVG set ---------------- */
  var Icons = (function(){

      return '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
    }
    return {
      play:   svg('<path d="M7 4.5v15l12-7.5z"/>'),
      ranked: svg('<path d="M5 20v-6M12 20V9M19 20V4"/>'),
      club:   svg('<circle cx="9" cy="8" r="3"/><circle cx="16.5" cy="10" r="2.4"/><path d="M4 19c0-2.8 2.2-5 5-5s5 2.2 5 5M14.5 19c.2-2.2 1.6-3.8 3.6-3.8 1.1 0 2 .4 2.6 1.1"/>'),
      bolt:   svg('<path d="M13 2 5 13h5l-1 9 8-11h-5z"/>'),
      cal:    svg('<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/>'),
      target: svg('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".5"/>'),
      pad:    svg('<path d="M6 9h12l2.5 8a2 2 0 0 1-3.3 2L14 16h-4l-3.2 3a2 2 0 0 1-3.3-2z"/><path d="M8.5 12v3M7 13.5h3M15.5 12.5h.01M17.5 14h.01"/>'),
      film:   svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4"/>'),
      news:   svg('<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>'),
      skate:  svg('<path d="M4 14h9l5-3 2 3v2H4zM4 20h16"/>'),
      goal:   svg('<path d="M4 20V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v13M4 20h16M8 20v-8m4 8v-8m4 8v-8M4 12h16"/>'),
      shield: svg('<path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/>'),
      gear:   svg('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>'),
      brush:  svg('<path d="M15 4l5 5-9 9H6v-5z"/><path d="M13 6l5 5"/>'),
      person: svg('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-6 7-6s6.2 2.4 7 6"/>')
    };
  })();

  /* ---------------- data: right-panel widgets ---------------- */
  function bar(pct){ return '<div class="bar"><span style="width:' + pct + '%"></span></div>'; }
  function shell(title, body){
    return '<section class="widget glass"><h2 class="widget-title">' + title + '</h2>' + body + '</section>';
  }
  var WIDGETS = [
    function nextMatch(){
      return shell('NEXT MATCH',
        '<div class="match-row"><div class="crest home">HW</div><span class="vs">VS</span><div class="crest">TB</div></div>' +
        '<p class="meta-line">Tonight · 19:30<br>Arena Helsinki</p>');
    },
    function seasonProgress(){
      return shell('SEASON PROGRESS',
        '<div class="stat-row"><span>SEASON 3</span><span>LVL 18 → 19</span></div>' +
        bar(62.5) +
        '<div class="stat-row"><b>6,250</b><span>/ 10,000 XP</span></div>');
    },
    function dailyChallenge(){
      return shell('DAILY CHALLENGE',
        '<div class="stat-row"><span>Score 3 goals</span><b>1 / 3</b></div>' +
        bar(33) +
        '<p class="reward-line">Reward <b>250 XP</b></p>');
    },
    function friendsOnline(){
      return shell('FRIENDS ONLINE · 8',
        '<div class="friend"><div class="av">HP</div><div><div class="n">HockeyPro</div><div class="st">In lobby</div></div><div class="dot"></div></div>' +
        '<div class="friend"><div class="av">PM</div><div><div class="n">PuckMaster</div><div class="st">In game</div></div><div class="dot"></div></div>' +
        '<div class="friend"><div class="av">ES</div><div><div class="n">EpicSauce</div><div class="st">Training</div></div><div class="dot"></div></div>' +
        '<p class="more-line">+5 more</p>');
    },
    function clubActivity(){
      return shell('CLUB ACTIVITY',
        '<ul class="activity-list">' +
        '<li><span class="act-dot"></span><span><b>PuckMaster</b> won a Ranked match</span><time>2h</time></li>' +
        '<li><span class="act-dot"></span><span>Club reached <b>Level 9</b></span><time>1d</time></li>' +
        '<li><span class="act-dot"></span><span>3 members are in a Club Match</span><time>now</time></li>' +
        '</ul>');
    },
    function news(){
      return shell('NEWS',
        '<div class="news-line">COMMUNITY CUP<br>FINALS THIS WEEKEND</div>' +
        '<p class="news-sub">Register your club before Friday to lock in a seed.</p>');
    }
  ];

  /* ---------------- dom refs ---------------- */
  var $tabs        = document.getElementById('tabs');
  var $tabIndicator= document.getElementById('tabIndicator');
  var $sectionTitle= document.getElementById('sectionTitle');
  var $menuList    = document.getElementById('menuList');
  var $menuRail    = document.getElementById('menuRail');
  var $widgetRail  = document.getElementById('widgetRail');
  var $capTitle    = document.getElementById('capTitle');
  var $capSub      = document.getElementById('capSub');
  var $stageCaption= document.getElementById('stageCaption');
  var $toast       = document.getElementById('toast');

  var tabIdx  = 1;  // PLAY
  var itemIdx = 0;
  var tabButtons  = [];
  var itemButtons = [];

  /* ---------------- top nav: tabs ---------------- */
  function buildTabs(){
    TABS.forEach(function(section, i){
      var b = document.createElement('button');
      b.className = 'tab';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', 'false');
      b.textContent = section.label;
      b.addEventListener('click', function(){ setTab(i); });
      $tabs.appendChild(b);
      tabButtons.push(b);
    });
  }

  function setTab(i){
    var n = TABS.length;
    tabIdx = (i + n) % n;
    itemIdx = 0;
    tabButtons.forEach(function(b, k){ b.setAttribute('aria-selected', k === tabIdx ? 'true' : 'false'); });
    $sectionTitle.textContent = TABS[tabIdx].label;
    buildMenuList();
    placeTabIndicator();
  }

  function placeTabIndicator(){
    var el = tabButtons[tabIdx];
    if (!el) return;
    $tabIndicator.style.width = el.offsetWidth + 'px';
    $tabIndicator.style.transform = 'translate(' + el.offsetLeft + 'px,-50%)';
  }

  /* ---------------- left panel: submenu list ---------------- */
  function buildMenuList(){
    itemButtons = [];
    var frag = document.createDocumentFragment();
    TABS[tabIdx].items.forEach(function(item, k){
      var b = document.createElement('button');
      b.className = 'menu-item';
      b.setAttribute('role', 'option');
      b.setAttribute('aria-selected', k === itemIdx ? 'true' : 'false');
      b.innerHTML = Icons[item.icon] +
        '<span><span class="t">' + item.t + '</span><span class="s">' + item.s + '</span></span>';
      b.addEventListener('click', function(){ itemIdx = k; refreshSelection(); activate(); });
      b.addEventListener('mouseenter', function(){ itemIdx = k; refreshSelection(false); });
      frag.appendChild(b);
      itemButtons.push(b);
    });
    // rail stays, items are rebuilt after it
    while ($menuList.lastChild && $menuList.lastChild !== $menuRail) $menuList.removeChild($menuList.lastChild);
    $menuList.appendChild(frag);
    refreshSelection(true);
    updateCaption();
  }

  function refreshSelection(moveFocus){
    itemButtons.forEach(function(b, k){ b.setAttribute('aria-selected', k === itemIdx ? 'true' : 'false'); });
    placeMenuRail();
    if (moveFocus !== false && itemButtons[itemIdx]) itemButtons[itemIdx].focus({ preventScroll:true });
  }

  function placeMenuRail(){
    var el = itemButtons[itemIdx];
    if (!el){ $menuRail.style.opacity = '0'; return; }
    $menuRail.style.opacity = '1';
    $menuRail.style.height = el.offsetHeight + 'px';
    $menuRail.style.transform = 'translateY(' + el.offsetTop + 'px)';
  }

  function moveItem(delta){
    var n = TABS[tabIdx].items.length;
    itemIdx = (itemIdx + delta + n) % n;
    refreshSelection();
    updateCaption();
  }

  function updateCaption(){
    var item = TABS[tabIdx].items[itemIdx];
    if (!item) return;
    $stageCaption.style.opacity = '0';
    setTimeout(function(){
      $capTitle.textContent = item.t;
      $capSub.textContent = item.s;
      $stageCaption.style.opacity = '1';
    }, 90);
  }

  function activate(){
    var el = itemButtons[itemIdx];
    if (el){
      el.classList.add('is-pressed');
      setTimeout(function(){ el.classList.remove('is-pressed'); }, 110);
    }
    var item = TABS[tabIdx].items[itemIdx];
    toast('LAUNCHING — ' + item.t.toUpperCase());
  }

  /* ---------------- right panel: widgets ---------------- */
  function buildWidgets(){
    $widgetRail.innerHTML = WIDGETS.map(function(fn){ return fn(); }).join('');
  }

  /* ---------------- toast ---------------- */
  var toastTimer = null;
  function toast(msg){
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ $toast.classList.remove('show'); }, 1300);
  }

  /* ---------------- keyboard ---------------- */
  function onKeydown(e){
    switch (e.key){
      case 'ArrowUp':    moveItem(-1); e.preventDefault(); break;
      case 'ArrowDown':  moveItem(1);  e.preventDefault(); break;
      case 'ArrowLeft':  setTab(tabIdx - 1); e.preventDefault(); break;
      case 'ArrowRight': setTab(tabIdx + 1); e.preventDefault(); break;
      case 'Enter':
      case ' ':          activate(); e.preventDefault(); break;
    }
  }

  /* ---------------- gamepad ---------------- */
  var padPrev = [];
  var stickCooldown = 0;
  var padLoopActive = false;
  var lastFrameTime = 0;

  function pollPad(dt){
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    var p = pads[0];
    if (!p) return;
    var hit = function(i){ return p.buttons[i] && p.buttons[i].pressed && !padPrev[i]; };

    if (hit(12)) moveItem(-1);
    if (hit(13)) moveItem(1);
    if (hit(4) || hit(14)) setTab(tabIdx - 1);
    if (hit(5) || hit(15)) setTab(tabIdx + 1);
    if (hit(0)) activate();

    stickCooldown -= dt;
    var ay = p.axes[1] || 0;
    if (Math.abs(ay) > 0.55 && stickCooldown <= 0){
      moveItem(ay > 0 ? 1 : -1);
      stickCooldown = 0.22;
    }
    for (var i = 0; i < p.buttons.length; i++) padPrev[i] = p.buttons[i].pressed;
  }

  function padLoop(now){
    if (!padLoopActive) return;
    var dt = Math.min((now - lastFrameTime) / 1000, 0.05);
    lastFrameTime = now;
    pollPad(dt);
    requestAnimationFrame(padLoop);
  }

  function startPadLoop(){
    if (padLoopActive) return;
    padLoopActive = true;
    lastFrameTime = performance.now();
    requestAnimationFrame(padLoop);
  }
  function stopPadLoop(){ padLoopActive = false; }

  function onPadConnected(){
    document.body.classList.add('pad-active');
    startPadLoop();
  }
  function onPadDisconnected(){
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    var any = false;
    for (var i = 0; i < pads.length; i++) if (pads[i]) any = true;
    if (!any){
      document.body.classList.remove('pad-active');
      stopPadLoop();
    }
  }

  /* ---------------- init ---------------- */
  function init(){
    buildTabs();
    setTab(tabIdx);
    buildWidgets();
    $toast.classList.remove('show');

    window.addEventListener('keydown', onKeydown);
    window.addEventListener('gamepadconnected', onPadConnected);
    window.addEventListener('gamepaddisconnected', onPadDisconnected);
    window.addEventListener('resize', function(){
      placeTabIndicator();
      placeMenuRail();
    });

    // a gamepad may already be connected before this script ran
    var pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (var i = 0; i < pads.length; i++){
      if (pads[i]){ onPadConnected(); break; }
    }
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
